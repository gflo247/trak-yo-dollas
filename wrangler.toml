# --- dev.trakyodollas.com (attached, confirmed live 2026-08-09) ---
# The dev worker (deployed via `./deploy.sh dev` -> `wrangler deploy --name
# trak-yo-dollas-dev`, see deploy.sh) is reachable at both the default
# trak-yo-dollas-dev.workers.dev URL and the custom domain
# dev.trakyodollas.com (confirmed via curl: /trakyodollas.html 307s to
# /trakyodollas, which then 200s). Cloudflare Workers' Custom Domains
# feature is entirely dashboard/API-managed (it provisions its own DNS
# record + SSL cert) -- nothing belongs in this file for it to work, so
# there's no wrangler.toml route/env block for it. deploy.sh needs no
# changes either way -- it already deploys the same worker both URLs point
# at.
#
# Not independently verified from this repo (no credentials to check):
# whether dev.trakyodollas.com is also added to Firebase Authentication's
# authorized domains list, and to the GCP API key's HTTP referrer
# restrictions. If sign-in or API calls misbehave specifically on
# dev.trakyodollas.com but work fine on the workers.dev URL, check those
# two dashboards first.
