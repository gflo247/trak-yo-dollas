name = "trak-yo-dollas"
account_id = "0595d072acba5ad45f35db62150ee35c"
compatibility_date = "2025-01-01"
main = "worker.js"

[assets]
directory          = "_cf_deploy"
binding            = "ASSETS"
not_found_handling = "404-page"

[[d1_databases]]
binding      = "DB"
database_name = "trak-yo-dollas-db"
database_id   = "c7c29496-83da-443e-b9cd-c2ea4d653d17"

# --- dev environment: isolated D1, same worker code as prod ---
# Deploy with: wrangler deploy --env dev  (deploy.sh does this automatically)
# Schema: wrangler d1 execute trak-yo-dollas-db-dev --remote --file=db/schema.sql
[env.dev]
name = "trak-yo-dollas-dev"

[[env.dev.d1_databases]]
binding      = "DB"
database_name = "trak-yo-dollas-db-dev"
database_id   = "7ec7483a-380e-4461-8bd1-31c47bbc2f67"

# --- dev.trakyodollas.com / Cloudflare Access (notes, dashboard-managed) ---
# dev.trakyodollas.com is a Custom Domain attached to trak-yo-dollas-dev
# (dashboard only -- nothing belongs in this file). Both that URL and
# trak-yo-dollas-dev.workers.dev are gated by Cloudflare Access, policy
# "Cloudflare account members" (Allow), scope "All traffic". To add a
# collaborator, add them as a Cloudflare account member.
# Dev now has its own D1 database (trak-yo-dollas-db-dev above), so it is
# fully isolated from production data.
